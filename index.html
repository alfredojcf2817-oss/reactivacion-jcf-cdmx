<!DOCTYPE html>
<html>
  <head>
    <base target="_top">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      :root {
        --color-primary: #9D2449; /* vino */
        --color-secondary: #838E5D; /* verde oliva */
        --color-bg: #fdfcfd;
        --color-text: #2b2b2b;
      }
      body {
        font-family: 'Segoe UI', Arial, sans-serif;
        background-color: var(--color-bg);
        color: var(--color-text);
        padding: 24px;
        margin: 0;
      }
      .container {
        max-width: 900px;
        margin: 0 auto;
        background-color: #fff;
        border-radius: 12px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        padding: 20px 30px 40px 30px;
      }
      .header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        border-bottom: 4px solid var(--color-primary);
        padding-bottom: 12px;
        margin-bottom: 24px;
      }
      .logo {
        height: 70px;
      }
      h2, h3, h4 {
        color: var(--color-primary);
      }
      input[type=text], input[type=file], input[type=number], textarea {
        width: 100%;
        border: 1px solid var(--color-secondary);
        border-radius: 6px;
        padding: 6px 8px;
        font-size: 14px;
        margin-top: 4px;
      }
      input[type=text]:focus, textarea:focus {
        outline: none;
        border-color: var(--color-primary);
        box-shadow: 0 0 3px var(--color-primary);
      }
      button {
        background-color: var(--color-primary);
        color: #fff;
        border: none;
        border-radius: 6px;
        padding: 8px 16px;
        font-size: 15px;
        cursor: pointer;
        transition: background 0.3s;
      }
      button:hover {
        background-color: var(--color-secondary);
      }
      .hidden { display:none; }
      .field { margin-bottom: 16px; }
      .preview img, .preview video, .preview audio {
        max-width: 150px;
        margin: 6px;
        border-radius: 6px;
        border: 1px solid #ddd;
      }
      .preview video, .preview audio {
        background: #fafafa;
      }
      #loginDiv {
        text-align: center;
        background: var(--color-primary);
        color: white;
        border-radius: 10px;
        padding: 30px 20px;
      }
      #loginDiv input {
        border: none;
        border-radius: 6px;
        padding: 8px 12px;
        width: 60%;
      }
      #loginDiv button {
        background-color: white;
        color: var(--color-primary);
        font-weight: bold;
        margin-left: 10px;
      }
      #loginDiv button:hover {
        background-color: var(--color-secondary);
        color: white;
      }
      #successDiv {
        background-color: #f7f9f5;
        border: 2px solid var(--color-secondary);
        border-radius: 8px;
        padding: 20px;
        text-align: center;
      }
      #bloqueoPantalla { position:fixed; inset:0; background:rgba(20,16,20,.78); z-index:99999; display:none; align-items:center; justify-content:center; flex-direction:column; color:#fff; font-weight:bold; text-align:center; gap:20px; padding:20px; box-sizing:border-box; }
    #bloqueoPantalla.visible { display:flex; }
    .spinner { width:58px; height:58px; border:6px solid rgba(255,255,255,.25); border-top-color:#fff; border-radius:50%; animation:girar .85s linear infinite; }
    @keyframes girar {to{transform:rotate(360deg)}}
    body.bloqueado {overflow:hidden;}
    body.bloqueado .container {pointer-events:none;}
  </style>
  </head>
  <body>
    <div id="bloqueoPantalla" role="status" aria-live="polite" aria-busy="true"><div class="spinner"></div><div id="textoBloqueo">VALIDANDO DATOS...</div></div>
    <div class="container">
      <div class="header">
        <img id="logo1" class="logo" src="" alt="Logo 1">
        <img id="logo2" class="logo" src="" alt="Logo 2">
      </div>

      <h2 style="text-align: center;">Formulario para reactivación de Centro de Trabajo de JCF-CDMX </h2>
      <div id="loginDiv">
        <input id="accessKey" placeholder="Ingresa tu clave">
        <button onclick="checkKey()">Entrar</button>
        <div id="loginMsg" style="margin-top:8px; color: #fff; font-weight: bold;"></div>
      </div>

      <div id="formDiv" class="hidden">
        <h3>Contesta las preguntas de manera correcta</h3>
        <form id="mainForm" onsubmit="return submitForm(event)">
          <div id="questions"></div>

          <div style="text-align:center;">
            <button type="submit">Enviar formulario</button>
          </div>
        </form>
      </div>

      <div id="successDiv" class="hidden">
        <h3>¡Gracias! Tu formulario fue enviado correctamente.</h3>
        <p id="successMsg"></p>
      </div>
    </div>

    <script>
      // PEGA LA URL /exec DE LA IMPLEMENTACIÓN NUEVA DE APPS SCRIPT.
      const FORM_TYPE = 'reactivacion';
      const API_URL = 'https://script.google.com/macros/s/AKfycbz14thdk1eSbMFuiD_R4ooJAb_y21RoYgMkoow12EO3VhiQA-np9cfVRUUOIcB7_jOz/exec';
      const pending = new Map();
      window.addEventListener('message', function(event) {
        // El mensaje proviene del iframe que carga Apps Script / googleusercontent.
        // Verificamos además identificador aleatorio y formato de respuesta.
        if (!/^https:\/\/(?:script\.google\.com|[a-z0-9.-]*googleusercontent\.com)$/.test(event.origin)) return;
        const data = event.data;
        if (!data || data.app !== 'jcf-pages-v1' || !pending.has(data.requestId)) return;
        const p = pending.get(data.requestId);
        clearTimeout(p.timer);
        pending.delete(data.requestId);
        p.frame.remove();
        p.resolve(data.result);
      });
      function api(action, payload) {
        if (API_URL.includes('PEGA_AQUI')) return Promise.reject(new Error('Configura API_URL en index.html'));
        return new Promise(function(resolve,reject){
          const requestId = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
          const frame = document.createElement('iframe');
          frame.name = 'respuesta_' + requestId.replace(/[^a-zA-Z0-9]/g,'');
          frame.style.display = 'none';
          document.body.appendChild(frame);
          const form = document.createElement('form');
          form.method='POST'; form.action=API_URL; form.target=frame.name;
          form.style.display='none';
          [['action',action],['requestId',requestId],['payload',JSON.stringify(Object.assign({}, payload, {formType: FORM_TYPE}))]].forEach(function(item){
            const input=document.createElement('input');input.type='hidden';input.name=item[0];input.value=item[1];form.appendChild(input);
          });
          document.body.appendChild(form);
          const timer=setTimeout(function(){pending.delete(requestId);frame.remove();reject(new Error('Tiempo de espera agotado. Comprueba la implementación y la conexión.'));},120000);
          pending.set(requestId,{resolve,reject,frame,timer});
          form.submit(); form.remove();
        });
      }

      document.getElementById('logo1').src = LOGO1_BASE64;
      document.getElementById('logo2').src = LOGO2_BASE64;

      // Las preguntas se administran desde la pestaña correspondiente al formulario.
      let currentQuestions = [];
      function renderQuestions(config) {
        currentQuestions = config;
        var cont = document.getElementById('questions');
        cont.replaceChildren();
        config.forEach(function(q) {
          if (!q.activa) return;
          var div = document.createElement('div'); div.className = 'field';
          var label = document.createElement('label');
          label.textContent = q.texto + (q.obligatoria ? ' *' : '');
          div.appendChild(label);
          var tipo = q.tipo;
          var input;
          if (tipo === 'archivo') {
            input = document.createElement('input');
            input.type = 'file'; input.name=q.id;
            input.accept=(q.extensiones||[]).map(function(x){return '.'+x;}).join(',');
            input.required=!!q.obligatoria;
            input.dataset.maxMb=String(q.maxMB||5);
            input.addEventListener('change',function(){
              const f=input.files[0];if(!f)return;
              const ext=f.name.split('.').pop().toLowerCase();
              if(!(q.extensiones||[]).includes(ext)||f.size>(q.maxMB||5)*1024*1024){
                alert('Archivo inválido para '+q.texto+'. Permitidos: '+q.extensiones.join(', ')+'. Máximo: '+q.maxMB+' MB.');input.value='';return;
              }
              previewFile(input, 'preview_'+q.id);
            });
          } else if (tipo === 'lista') {
            input = document.createElement('select');
            var inicio = document.createElement('option'); inicio.value=''; inicio.textContent='Selecciona una opción';
            input.appendChild(inicio);
            q.opciones.forEach(function(op) { var o=document.createElement('option');o.value=op;o.textContent=op;input.appendChild(o); });
          } else if (tipo === 'multiple' || tipo === 'casillas') {
            input = document.createElement('div');
            q.opciones.forEach(function(op, j) {
              var line=document.createElement('label');line.style.fontWeight='normal';
              var control=document.createElement('input');
              control.type=tipo==='multiple'?'radio':'checkbox';control.name=q.id;control.value=op;
              control.required=!!q.obligatoria && tipo==='multiple';
              line.appendChild(control);line.appendChild(document.createTextNode(' '+op));input.appendChild(line);
            });
            if (tipo==='casillas' && q.obligatoria) input.dataset.requiredGroup=q.id;
          } else {
            input = document.createElement(tipo==='parrafo'?'textarea':'input');
            if (tipo!=='parrafo') input.type=tipo==='numero'?'number':tipo==='fecha'?'date':'text';
            input.name=q.id;input.required=!!q.obligatoria;
            input.placeholder=q.ayuda||'';
          }
          if (tipo==='lista') {input.name=q.id;input.required=!!q.obligatoria;}
          div.appendChild(input);
          if(tipo==='archivo') {
            const info=document.createElement('small');
            info.textContent='Formatos: '+q.extensiones.join(', ').toUpperCase()+' · Máximo '+q.maxMB+' MB · Un archivo';
            div.appendChild(info);
            const vista=document.createElement('div');vista.id='preview_'+q.id;div.appendChild(vista);
          }
          if(q.ayuda && (tipo==='lista'||tipo==='multiple'||tipo==='casillas')) {
            var small=document.createElement('small');small.textContent=q.ayuda;div.appendChild(small);
          }
          cont.appendChild(div);
        });
      }
      api('questions',{}).then(function(r){if(!r.ok) throw Error(r.message);renderQuestions(r.questions);}).catch(function(e){document.getElementById('questions').textContent='Error al cargar preguntas: '+e.message;});

      var currentKey = null;
      function checkKey(){
        var k = document.getElementById('accessKey').value.trim();
        document.getElementById('loginMsg').textContent = '';
        if (!k){ document.getElementById('loginMsg').textContent = 'Ingresa una clave.'; return; }
        bloquear('VALIDANDO CLAVE...');
        api('validate',{key:k}).then(function(res){
          desbloquear();
          if (res.ok){
            currentKey = k;
            document.getElementById('loginDiv').classList.add('hidden');
            document.getElementById('formDiv').classList.remove('hidden');
          } else {
            document.getElementById('loginMsg').textContent = res.message || 'Clave inválida.';
          }
        }).catch(function(err){ desbloquear(); document.getElementById('loginMsg').textContent = err.message || String(err); });
      }

      function previewFile(input, targetId){
        var t = document.getElementById(targetId);
        t.innerHTML = '';
        var file = input.files[0];
        if (!file) return;
        var reader = new FileReader();
        reader.onload = function(e){
          var s = e.target.result;
          if (file.type.indexOf('image/')===0){
            var img = document.createElement('img'); img.src = s; t.appendChild(img);
          } else if (file.type.indexOf('video/')===0){
            var v = document.createElement('video'); v.controls=true; v.src=s; t.appendChild(v);
          } else if (file.type.indexOf('audio/')===0){
            var a = document.createElement('audio'); a.controls=true; a.src=s; t.appendChild(a);
          } else {
            var p = document.createElement('div'); p.textContent = file.name; t.appendChild(p);
          }
        };
        reader.readAsDataURL(file);
      }

      function bloquear(texto) {
        document.getElementById('textoBloqueo').textContent = texto;
        document.getElementById('bloqueoPantalla').classList.add('visible');
        document.body.classList.add('bloqueado');
      }
      function desbloquear() {
        document.getElementById('bloqueoPantalla').classList.remove('visible');
        document.body.classList.remove('bloqueado');
      }
      function validarArchivo(input, preview, tipo) {
        const file = input.files[0];
        if (!file) return;
        const ext = file.name.split('.').pop().toLowerCase();
        const permitido = tipo === 'documento'
          ? ['pdf','png','jpg','jpeg'].includes(ext)
          : ['png','jpg','jpeg'].includes(ext);
        const mimeOk = tipo === 'documento'
          ? ['application/pdf','image/png','image/jpeg'].includes(file.type)
          : ['image/png','image/jpeg'].includes(file.type);
        if (!permitido || !mimeOk) {
          input.value = '';
          document.getElementById(preview).innerHTML = '';
          alert('Formato no permitido. ' + (tipo === 'documento' ? 'Usa PDF, PNG, JPG o JPEG.' : 'Usa PNG, JPG o JPEG.'));
          return;
        }
        previewFile(input, preview);
      }

      function fileToBase64(file){
        return new Promise(function(resolve,reject){
          var r = new FileReader();
          r.onload = function(e){ resolve({name:file.name, mime:file.type || 'application/octet-stream', base64: e.target.result}); };
          r.onerror = reject;
          r.readAsDataURL(file);
        });
      }

      async function submitForm(e){
        e.preventDefault();
        if (!currentKey){ alert('Clave requerida.'); return; }
        var form = document.getElementById('mainForm');
        var fd = new FormData(form);
        var answers = {};
        for (var pair of fd.entries()){
          if (!(pair[1] instanceof File)) answers[pair[0]] = pair[1];
        }

        // Validar y recopilar correctamente los grupos de casillas.
        var grupos = document.querySelectorAll('[data-required-group]');
        for (var g of grupos) {
          if (!g.querySelector('input:checked')) {
            alert('Selecciona al menos una opción en: '+g.previousElementSibling.textContent);
            return false;
          }
        }
        document.querySelectorAll('#questions input[type=checkbox]').forEach(function(c){
          if(c.checked) {
            if (!Array.isArray(answers[c.name])) answers[c.name]=[];
            answers[c.name].push(c.value);
          }
        });
        Object.keys(answers).forEach(function(k){if(Array.isArray(answers[k])) answers[k]=answers[k].join(', ');});

        // Validar archivos dinámicos antes de bloquear la pantalla.
        for (const q of currentQuestions) {
          if (!q.activa || q.tipo!=='archivo') continue;
          const el=document.querySelector('#questions input[name="'+q.id+'"]');
          const f=el && el.files[0];
          if(q.obligatoria&&!f){alert('Falta archivo obligatorio: '+q.texto);return false;}
          if(f){
            const ext=f.name.split('.').pop().toLowerCase();
            if(!q.extensiones.includes(ext)||f.size>q.maxMB*1024*1024){
              alert('Archivo inválido en '+q.texto+' (máximo '+q.maxMB+' MB).');return false;
            }
          }
        }
        bloquear('PREPARANDO Y ENVIANDO INFORMACIÓN...');
        var filesToSend = [];
        try {
          for (const q of currentQuestions) {
            if (!q.activa || q.tipo !== 'archivo') continue;
            const el = Array.from(document.querySelectorAll('#questions input[type="file"]')).find(function(x){return x.name===q.id;});
            if (!el || !el.files[0]) continue;
            const convertido = await fileToBase64(el.files[0]);
            convertido.field = q.id;
            filesToSend.push(convertido);
          }
        } catch(err) {
          desbloquear();
          alert('Error leyendo archivos: ' + (err.message || err));
          return false;
        }

        var payload = { key: currentKey, answers: answers, files: filesToSend, formType: FORM_TYPE };
        document.getElementById('successMsg').textContent = 'Enviando...';
        api('submit',payload).then(function(res){
          desbloquear();
          if (res && res.ok){
            document.getElementById('formDiv').classList.add('hidden');
            document.getElementById('successDiv').classList.remove('hidden');
            document.getElementById('successMsg').textContent = 'Tu respuesta fue guardada. Archivos: ' + (res.files? res.files.length:0);
            currentKey = null;
          } else {
            alert('Error en el servidor: ' + JSON.stringify(res));
          }
        }).catch(function(err){ desbloquear(); alert('No se pudo enviar: ' + (err.message || err)); });
        return false;
      }
    </script>
